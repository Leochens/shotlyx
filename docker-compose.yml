services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shotlyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shotlyx}
      POSTGRES_DB: shotlyx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotlyx"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-example_token}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: ./apps/renderer/Dockerfile
      args:
        - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID:-}
        - FREESOUND_API_KEY=${FREESOUND_API_KEY:-}
        - VITE_MARBLE_API_URL=${VITE_MARBLE_API_URL:-https://api.marblecms.com}
        - VITE_SHOTLYX_SERVER_URL=${VITE_SHOTLYX_SERVER_URL:-http://localhost:8787}
        - MARBLE_WORKSPACE_KEY=${MARBLE_WORKSPACE_KEY:-build-placeholder}
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://shotlyx:${POSTGRES_PASSWORD:-shotlyx}@db:5432/shotlyx
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local-dev-only-change-me}
      - UPSTASH_REDIS_REST_URL=http://serverless-redis-http:80
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-example_token}
      - VITE_SITE_URL=http://localhost:3100
      - VITE_MARBLE_API_URL=https://api.marblecms.com
      - MARBLE_WORKSPACE_KEY=${MARBLE_WORKSPACE_KEY:-placeholder}
      - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID:-}
      - FREESOUND_API_KEY=${FREESOUND_API_KEY:-}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r=await fetch('http://127.0.0.1:3000/'); process.exit(r.ok?0:1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - DATABASE_URL=postgresql://shotlyx:${POSTGRES_PASSWORD:-shotlyx}@db:5432/shotlyx
      - SHOTLYX_ADMIN_TOKEN=${SHOTLYX_ADMIN_TOKEN:-local-dev-admin-token}
      - SHOTLYX_INITIAL_QUOTA=${SHOTLYX_INITIAL_QUOTA:-100000}
      - SHOTLYX_NEW_API_BASE_URL=${SHOTLYX_NEW_API_BASE_URL:-}
      - SHOTLYX_NEW_API_ADMIN_TOKEN=${SHOTLYX_NEW_API_ADMIN_TOKEN:-}
      - SHOTLYX_NEW_API_DEFAULT_GROUP=${SHOTLYX_NEW_API_DEFAULT_GROUP:-default}
      - SHOTLYX_ZPAY_PID=${SHOTLYX_ZPAY_PID:-}
      - SHOTLYX_ZPAY_KEY=${SHOTLYX_ZPAY_KEY:-}
      - SHOTLYX_ZPAY_SUBMIT_URL=${SHOTLYX_ZPAY_SUBMIT_URL:-https://zpayz.cn/submit.php}
      - SHOTLYX_SERVER_PUBLIC_URL=${SHOTLYX_SERVER_PUBLIC_URL:-http://localhost:8787}
      - SHOTLYX_CREDITS_PER_CNY=${SHOTLYX_CREDITS_PER_CNY:-100}
      - BILLING_CENTER_BASE_URL=${BILLING_CENTER_BASE_URL:-https://pay.guantou.site}
      - BILLING_CENTER_API_KEY=${BILLING_CENTER_API_KEY:-}
      - BILLING_CENTER_APP_CODE=${BILLING_CENTER_APP_CODE:-shotlyx}
      - USAGE_CREDITS_LLM_AGENT_TURN=${USAGE_CREDITS_LLM_AGENT_TURN:-20}
      - USAGE_CREDITS_LLM_AGENT_LONG_TURN=${USAGE_CREDITS_LLM_AGENT_LONG_TURN:-80}
      - USAGE_CREDITS_ASR_TRANSCRIPTION_MINUTE=${USAGE_CREDITS_ASR_TRANSCRIPTION_MINUTE:-8}
      - USAGE_CREDITS_ASR_CONTEXT_MINUTE=${USAGE_CREDITS_ASR_CONTEXT_MINUTE:-12}
      - USAGE_CREDITS_TTS_1K_CHARS=${USAGE_CREDITS_TTS_1K_CHARS:-200}
      - USAGE_CREDITS_VOICE_CLONE_TTS_1K_CHARS=${USAGE_CREDITS_VOICE_CLONE_TTS_1K_CHARS:-300}
      - USAGE_CREDITS_VOICE_CLONE_TRAINING=${USAGE_CREDITS_VOICE_CLONE_TRAINING:-1000}
      - USAGE_CREDITS_IMAGE_GENERATION=${USAGE_CREDITS_IMAGE_GENERATION:-150}
      - USAGE_CREDITS_MG_GENERATION=${USAGE_CREDITS_MG_GENERATION:-200}
      - USAGE_CREDITS_VIDEO_UNDERSTANDING_BASE=${USAGE_CREDITS_VIDEO_UNDERSTANDING_BASE:-50}
      - USAGE_CREDITS_VIDEO_UNDERSTANDING_MINUTE=${USAGE_CREDITS_VIDEO_UNDERSTANDING_MINUTE:-15}
      - USAGE_CREDITS_VIDEO_GENERATION_5S_720P=${USAGE_CREDITS_VIDEO_GENERATION_5S_720P:-1200}
      - USAGE_CREDITS_VIDEO_GENERATION_5S_1080P=${USAGE_CREDITS_VIDEO_GENERATION_5S_1080P:-2000}
      - USAGE_CREDITS_STOCK_IMPORT=${USAGE_CREDITS_STOCK_IMPORT:-5}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_KEY_PREFIX=${STORAGE_KEY_PREFIX:-shotlyx}
      - STORAGE_MAX_UPLOAD_SIZE_MB=${STORAGE_MAX_UPLOAD_SIZE_MB:-5120}
      - ALLOW_LOCAL_STORAGE_IN_PRODUCTION=${ALLOW_LOCAL_STORAGE_IN_PRODUCTION:-true}
      - COS_REGION=${COS_REGION:-}
      - COS_BUCKET=${COS_BUCKET:-}
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_PUBLIC_BASE_URL=${COS_PUBLIC_BASE_URL:-}
      - COS_SIGNED_URL_TTL_SECONDS=${COS_SIGNED_URL_TTL_SECONDS:-3600}
      - COS_UPLOAD_STS_TTL_SECONDS=${COS_UPLOAD_STS_TTL_SECONDS:-1800}
      - COS_UPLOAD_SLICE_SIZE_MB=${COS_UPLOAD_SLICE_SIZE_MB:-8}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r=await fetch('http://127.0.0.1:8787/api/health'); process.exit(r.ok?0:1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:

networks:
  default:
    name: shotlyx-network
